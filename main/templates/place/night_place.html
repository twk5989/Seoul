{% load static %}
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>야경명소</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="{% static 'css/main/night_place.css' %}" />
</head>
<body class="bg-white font-sans">
  {% include 'layout/menu.html' with request=request %}

  <div class="p-5">
    <div class="max-w-7xl mx-auto space-y-10">

      <!-- 헤더 + 지역 선택 -->
      <div class="flex justify-between items-center mb-6 px-4">
        <h1 class="text-lg text-white">📍총 <span id="nightCount">0</span>건</h1>
        <div id="night_table-data-list"></div>

        <!-- 드롭다운 -->
        <div class="region-filter w-60">
          <select
            id="district-select"
            class="w-full appearance-none bg-white border border-gray-300 rounded-lg px-4 py-2 text-gray-700 shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-400 focus:border-blue-400"
          >
            <option value="">지역을 선택하세요</option>
            <option value="강남구">강남구</option>
            <option value="도봉구">도봉구</option>
            <option value="동대문구">동대문구</option>
            <option value="동작구">동작구</option>
            <option value="마포구">마포구</option>
            <option value="서대문구">서대문구</option>
            <option value="서초구">서초구</option>
            <option value="성동구">성동구</option>
            <option value="성북구">성북구</option>
            <option value="송파구">송파구</option>
            <option value="양천구">양천구</option>
            <option value="강동구">강동구</option>
            <option value="영등포구">영등포구</option>
            <option value="용산구">용산구</option>
            <option value="은평구">은평구</option>
            <option value="종로구">종로구</option>
            <option value="중구">중구</option>
            <option value="중랑구">중랑구</option>
            <option value="강북구">강북구</option>
            <option value="강서구">강서구</option>
            <option value="관악구">관악구</option>
            <option value="광진구">광진구</option>
            <option value="구로구">구로구</option>
            <option value="금천구">금천구</option>
            <option value="노원구">노원구</option>
          </select>
        </div>
      </div>

      <!-- 카드 슬라이더 영역 -->
      <div class="card-container rounded-3xl p-8 mx-auto max-w-6xl bg-black">
        <h2 class="text-5xl font-bold text-center text-white mb-12" style="font-family: 'Arial Black', sans-serif; text-shadow: 2px 2px 4px rgba(0,0,0,0.5);">
          Night View Spot
        </h2>

        <div class="relative">
          <div class="flex justify-center items-center space-x-6 mb-8" id="cardSlider"></div>

          <div class="flex justify-center space-x-4">
            <button id="prevBtn" class="nav-button w-12 h-12 rounded-full bg-gray-700 hover:bg-gray-900 text-white font-bold text-xl">←</button>
            <button id="nextBtn" class="nav-button w-12 h-12 rounded-full bg-gray-700 hover:bg-gray-900 text-white font-bold text-xl">→</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="{% static 'js/slider/night_slider.js' %}"></script>
  <script src="{% static 'js/night_place.js' %}"></script>
</body>
</html>
