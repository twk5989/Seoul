
<div id="searchModal" class="fixed inset-0 z-50 bg-black bg-opacity-40 hidden flex justify-center items-center">
  <div class="bg-white rounded-lg p-6 w-[90%] max-w-xl shadow-lg relative">
    <button id="closeSearch" class="absolute top-2 right-2 text-gray-600 hover:text-red-500">
      ✖
    </button>
    <form id="searchForm" method="GET" class="flex flex-col gap-4">
      <h2 class="text-xl font-bold">검색</h2>
      <input
        type="text"
        name="q"
        placeholder="장소명을 입력하세요"
        class="border border-gray-300 rounded px-4 py-2"
        required
      />
      <button type="submit" class="bg-blue-500 text-white px-4 py-2 rounded hover:bg-blue-600">
        검색
      </button>
    </form>
    <div id="searchResults" class="mt-4 max-h-[300px] overflow-y-auto"></div>
  </div>
</div>
